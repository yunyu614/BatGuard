# BatGuard 配置（改完自动生效，无需重启）
# 1=启用充电控制  0=只统计不停充
enabled=1

# 充电上限（%）：达到就停充
limit=80
# 回落阈值（%）：掉到这个值以下恢复充电
resume=75

# 停充方式：auto | threshold | switch
#   auto      自动探测（优先内核阈值节点，没有就用开关节点）
#   threshold 用 charge_control_end_threshold 这类内核节点（写入上限值）
#   switch    用开关节点（0/1 翻转）
mode=auto

# 手动指定节点（留空=自动探测）
stop_node=
stop_value=0
start_node=
start_value=1

# 采样间隔（秒）
sample_charging=15
sample_idle=60

# 模块描述刷新间隔（秒）
desc_interval=300

# 同时限制充电电流（mA，0=不限制）
current_limit=0

# 温控档位（thermal_message/sconfig）：-1=跟随系统；0=最激进（不额外限制）；数值越大越保守
# 注意：0 档会让 CPU/充电温控放宽，容易发热，慎用
thermal_level=-1
